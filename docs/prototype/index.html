<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeekHarness 工作流交互原型</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#181b22);--nav:light-dark(#eef0f5,#20242e);--soft:light-dark(#f5f6f9,#262b35);--line:light-dark(#dfe3eb,#424955);--text:light-dark(#20242e,#eef0f5);--muted:light-dark(#677184,#b0b7c4);--blue:light-dark(#2864e8,#83a6ff);--tint:light-dark(#edf3ff,#283955);--green:light-dark(#167348,#7bd8ab);--red:light-dark(#b2313f,#ff9aa5);--shadow:0 10px 35px #0002;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--text);background:var(--bg)}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 11px}button:hover{background:var(--soft)}button[disabled]{opacity:.45;cursor:default}.primary{background:var(--blue);color:light-dark(#fff,#101820);border-color:var(--blue)}.primary:hover{filter:brightness(1.08);background:var(--blue)}.quiet{border-color:transparent;background:transparent}.active{background:var(--tint);color:var(--blue);border-color:var(--blue)}input,select,textarea{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;max-width:100%}textarea{resize:vertical;width:100%;min-height:80px}label{display:block}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 9px}p{margin:7px 0}.muted{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:12px}.hidden{display:none!important}.demo{background:var(--tint);padding:6px 16px;font-size:12px;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100dvh - 32px)}.nav{background:var(--nav);padding:24px 15px;display:flex;flex-direction:column;gap:9px;border-right:1px solid var(--line)}.brand{font-size:20px;font-weight:650;margin-bottom:20px;letter-spacing:-.7px}.brand small{font-size:10px;background:var(--text);color:var(--bg);padding:2px 4px;border-radius:3px}.nav button{text-align:left}.nav .workspace{font-size:12px;color:var(--muted);margin-top:24px}.nav .tail{margin-top:auto}.main{min-width:0;position:relative;background:var(--bg)}.page{padding:26px}.toolbar{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar .grow{flex:1;min-width:100px}.filters{padding:15px 0;display:flex;gap:9px;flex-wrap:wrap;align-items:center}.filters input{flex:1;min-width:160px;max-width:320px}.filterbox{padding:12px;background:var(--soft);border-radius:10px;margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.flowcard{padding:18px;text-align:left;border-radius:14px;display:grid;gap:11px;min-height:180px}.flowcard strong{font-size:16px}.badge{border-radius:6px;padding:2px 6px;background:var(--soft);font-size:12px;display:inline-flex;align-items:center;gap:5px}.badge.ok{color:var(--green)}.badge.error{color:var(--red)}.empty{padding:80px 24px;text-align:center;border:1px dashed var(--line);border-radius:12px}.canvas-layout{display:grid;grid-template-columns:minmax(0,1fr);min-height:calc(100dvh - 32px)}.canvas-layout.split{grid-template-columns:minmax(280px,42%) minmax(350px,58%)}.chat{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:690px}.chatbody{padding:22px;flex:1;display:grid;align-content:start;gap:20px}.bubble{background:var(--soft);padding:14px;border-radius:12px;overflow-wrap:anywhere}.assistant{padding:0 3px}.composer{margin:15px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}.composer textarea{border:0;background:transparent;min-height:75px;outline-offset:2px}.mention{display:inline-block;padding:3px 7px;border-radius:6px;background:var(--tint);color:var(--blue);font-size:12px}.canvas{position:relative;min-width:0}.canvashead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.canvashead strong{flex:1;min-width:110px}.canvashead button{font-size:12px}.tools{padding:9px 12px;display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.tools button{font-size:12px;padding:5px 8px}.viewport{position:relative;height:485px;overflow:auto;background:radial-gradient(var(--line) 1px,transparent 1px) 0 0/18px 18px}.stage{width:1040px;height:650px;position:relative;transform-origin:top left}.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}.edge{stroke:var(--muted);stroke-width:1.5;fill:none}.node{position:absolute;width:194px;padding:12px;border:1px solid var(--line);background:var(--bg);border-radius:12px;box-shadow:0 2px 5px #0001;cursor:grab;user-select:none;min-height:94px}.node.selected{border-color:var(--blue);outline:2px solid var(--blue);outline-offset:1px;box-shadow:0 0 0 5px var(--tint)}.node.success{border-color:var(--green)}.node.failed{border-color:var(--red)}.node.running{outline:2px solid var(--blue)}.node .title{font-weight:600;margin:6px 0 3px}.node .type{font-size:11px;color:var(--muted)}.node:focus-visible{outline:3px solid var(--blue)}.selection-box{position:absolute;border:1px solid var(--blue);background:var(--tint);opacity:.65;pointer-events:none;z-index:4}.pins{position:absolute;right:-8px;top:-13px;display:flex;gap:3px}.pin{border-radius:50%;background:var(--blue);color:var(--bg);width:25px;height:25px;padding:0;border:2px solid var(--bg);font-size:12px}.sticky{position:absolute;left:54px;top:360px;width:240px;padding:14px;background:light-dark(#fff7d4,#51492a);border-radius:8px;font-size:12px}.selectbar{position:absolute;right:14px;top:8px;z-index:3;display:flex;gap:6px;padding:5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.selectbar button{font-size:12px}.graphwrap{position:relative}.foot{padding:8px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);font-size:12px}.panel{border-top:1px solid var(--line);padding:18px;background:var(--bg)}.panelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.panelgrid label{display:grid;gap:5px}.config{position:absolute;top:65px;right:0;bottom:0;width:min(370px,100%);z-index:6;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow:auto;padding:18px}.config label{margin:13px 0}.config input:not([type=checkbox]),.config select{width:100%}.statusbar{padding:11px 16px;background:var(--soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap}.statusbar span{flex:1}.statusbar.error{background:light-dark(#fff0f0,#42282c)}.log{display:grid;gap:8px}.logline{display:flex;gap:12px;justify-content:space-between;padding:9px;border-bottom:1px solid var(--line)}.overlay{position:fixed;inset:0;background:#0005;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:min(560px,100%);max-height:85dvh;overflow:auto;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:var(--shadow)}.dialog.wide{width:min(750px,100%)}.dialog .actions{margin-top:20px;display:flex;justify-content:flex-end;gap:8px}.dialog label{margin:12px 0}.dialog .choice{padding:12px;border:1px solid var(--line);border-radius:9px;display:flex;gap:10px;align-items:flex-start}.dialog .choice input{margin-top:5px}.dialog .choice span{display:block}.nodepalette{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.nodepalette button{text-align:left}.settings{display:grid;grid-template-columns:160px minmax(0,1fr);gap:25px}.settingnav{display:grid;align-content:start;gap:8px}.presetgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.preset{border:1px solid var(--line);border-radius:13px;padding:17px}.preset p{color:var(--muted);min-height:70px}.context{position:fixed;z-index:30;background:var(--bg);border:1px solid var(--line);padding:6px;box-shadow:var(--shadow);border-radius:9px;display:grid;min-width:155px}.context button{text-align:left;border:0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;background:var(--text);color:var(--bg);padding:10px 17px;border-radius:10px;max-width:85%;box-shadow:var(--shadow)}.fieldhint{font-size:12px;color:var(--muted);margin:5px 0 14px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:12px;border-radius:8px;font-size:12px}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.activity{display:grid;gap:10px}.activity>div{border-left:2px solid var(--line);padding-left:12px}.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.progress div{height:100%;background:var(--blue);transition:width .25s}.mini{font-size:12px}.error-text{color:var(--red)}.row input[type=checkbox]{width:auto}.nodehint{position:absolute;left:12px;top:8px;pointer-events:none;font-size:11px;color:var(--muted)}
@media(max-width:1000px){.app{grid-template-columns:160px minmax(0,1fr)}.canvas-layout.split{grid-template-columns:minmax(210px,40%) minmax(300px,60%)}.nav{padding:20px 10px}.page{padding:20px}}@media(max-width:760px){.app{grid-template-columns:112px minmax(0,1fr)}.brand{font-size:14px}.brand small{display:block;width:max-content}.nav{padding:15px 6px}.nav button{padding:8px 5px;font-size:12px}.canvas-layout.split{display:flex;flex-direction:column}.chat{min-height:300px;border-right:0;border-bottom:1px solid var(--line)}.chatbody{padding:15px}.viewport{height:390px}.settings{grid-template-columns:1fr}.settingnav{display:flex;flex-wrap:wrap}.columns{grid-template-columns:1fr}.page{padding:16px}.cards{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Dify-inspired canvas: floating left tools, roomy dotted workspace, bottom history and zoom. */
.canvas{display:flex;flex-direction:column;min-height:calc(100dvh - 32px)}.graphwrap{flex:1;min-height:520px;display:flex}.viewport{height:auto;min-height:520px;flex:1}.tools{position:absolute;left:12px;top:90px;z-index:5;display:flex;flex-direction:column;padding:5px;gap:4px;border:1px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:0 2px 8px #0001}.tools button{width:34px;height:34px;padding:3px;font-size:19px;border:0}.tools hr{width:24px;margin:3px auto}.canvasmeta{display:flex;justify-content:flex-end;gap:4px;padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.canvasmeta button{font-size:11px;padding:4px 7px;border-color:transparent;background:transparent}.nodehint{left:66px;top:12px}.canvashead{padding:12px}.stage .node{min-height:94px}.foot{background:var(--bg)}
</style>
</head>
<body>
<div class="demo"><span>交互原型 · v0.3 · 页面与状态演示，执行和发布为模拟</span><span>区域 A：左侧导航　区域 B：主内容区</span></div>
<div class="app">
 <aside class="nav" aria-label="A 区导航">
  <div class="brand">deepseek <small>HARNESS</small></div>
  <button data-action="chat-new">＋ 新会话</button><button class="quiet" data-action="plugins">插件</button>
  <button id="nav-workflows" class="active" data-action="home">▦ 工作流</button>
  <div class="workspace">工作区</div><button class="quiet" data-action="workspace-default">默认工作区</button><button class="quiet" data-action="workspace-finance">财务研究</button>
  <button class="quiet tail" data-action="settings">设置</button>
 </aside>
 <main id="main" class="main" aria-label="B 区主内容"></main>
</div>
<div id="overlay-root"></div><div id="context-root"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initialNodes=()=>[{id:'input',alias:'a-1',name:'接收资料',type:'用户输入',x:42,y:80,model:'',effort:'',role:'',fixed:false},{id:'analyze',alias:'a-2',name:'分析资料',type:'LLM',x:306,y:80,model:'跟随生成时 Agent 模型',effort:'中',role:'研究分析员',fixed:false},{id:'verify',alias:'a1-1',name:'核验关键结论',type:'LLM',x:306,y:265,model:'跟随生成时 Agent 模型',effort:'高',role:'逻辑审校员',fixed:true},{id:'output',alias:'a-3',name:'形成分析报告',type:'输出',x:578,y:80,model:'',effort:'',role:'',fixed:false}];
const flows=[{id:'research',name:'资料研究与交叉核验',desc:'提取多份资料中的观点，核验来源并整理报告。',workspace:'默认工作区',status:'未运行',date:'刚刚'},{id:'review',name:'产品需求评审',desc:'检查需求范围、异常流程和验收条件。',workspace:'默认工作区',status:'失败',date:'今天 09:20'},{id:'finance',name:'财报分析',desc:'对比两家公司，输出盈利能力与现金流分析。',workspace:'财务研究',status:'成功',date:'昨天 16:45'}];
const state={page:'home',origin:'library',mode:'full',flow:flows[0],workspace:'默认工作区',filter:'全部',search:'',showFilter:false,showWorkspace:false,nodes:initialNodes(),selection:[],notes:[],nextNote:1,draft:'',messages:[],phase:'idle',attempts:0,faultMode:'B',repairLimit:2,simulateFailure:false,zoom:1,tool:'pointer',panel:'',config:null,undo:[],redo:[],revision:1,saved:true,runVersion:null,presets:[{name:'研究分析员',prompt:'围绕任务目标提取关键事实，区分事实、推断与待核验内容，并提供来源。'},{name:'逻辑审校员',prompt:'检查论证、事实关联和资料一致性，指出证据缺口，不编造来源。'}],vars:[{name:'report_language',value:'中文'}],collab:[{text:'核验步骤保留来源字段。',resolved:false}],runTimer:null,hasInput:false};
let noteEdit=null,dialogKind='',drag=null,lastPos=null,box=null,toastTimer=null;
const isModel=n=>['LLM','Agent','经典 Agent','新 Agent','问题分类器','参数提取器'].includes(n.type);
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function saveUndo(){state.undo.push(JSON.stringify(state.nodes));state.redo=[]}
function touch(){state.revision++;state.saved=true}
function modeLabel(){return state.phase==='idle'?'未运行':({waiting:'等待用户',running:'运行中',repair:'修复中',paused:'已暂停',success:'成功',failed:'失败',cancelled:'已取消'}[state.phase]||state.phase)}
function workflowNav(){state.page='home';state.config=null;state.panel='';render()}
function openFlow(id,origin='library'){state.flow=flows.find(f=>f.id===id)||flows[0];state.origin=origin;state.mode=origin==='chat'?'side':'full';state.page='canvas';state.config=null;state.panel='';render()}
function render(){const previousViewport=$('#viewport'),oldScroll=previousViewport?{left:previousViewport.scrollLeft,top:previousViewport.scrollTop}:null;const main=$('#main');$('#nav-workflows').classList.toggle('active',state.page==='home'||state.page==='canvas');if(state.page==='home')main.innerHTML=home();else if(state.page==='settings')main.innerHTML=settings();else main.innerHTML=canvasPage();bindInputs();if(oldScroll&&$('#viewport')){$('#viewport').scrollLeft=oldScroll.left;$('#viewport').scrollTop=oldScroll.top}requestAnimationFrame(drawEdges)}
function home(){const list=flows.filter(f=>(state.workspace==='全部工作区'||f.workspace===state.workspace)&&(state.filter==='全部'||f.status===state.filter)&&f.name.includes(state.search));return `<section class="page"><div class="row spread"><div><h1>工作流</h1><p class="muted">创建、管理和复用你的工作流程</p></div><div class="row"><button data-action="import">导入 DSL</button><button class="primary" data-action="new-flow">＋ 新建工作流</button></div></div><div class="filters"><input id="search" aria-label="搜索工作流" placeholder="搜索工作流" value="${esc(state.search)}"><button data-action="filter">筛选${state.filter!=='全部'?' · '+state.filter:''}</button><button data-action="workspace-filter">工作区筛选 · ${esc(state.workspace)}</button></div>${state.showFilter?`<div class="filterbox"><label>最近运行状态 <select id="status-filter">${['全部','未运行','成功','失败'].map(v=>`<option ${state.filter===v?'selected':''}>${v}</option>`).join('')}</select></label><button data-action="clear-filter">清除属性筛选</button></div>`:''}${state.showWorkspace?`<div class="filterbox"><label>显示工作区 <select id="workspace-filter">${['默认工作区','财务研究','全部工作区'].map(v=>`<option ${state.workspace===v?'selected':''}>${v}</option>`).join('')}</select></label><span class="muted">筛选只影响展示，不移动工作流。</span></div>`:''}<div class="row spread mini" style="margin:0 0 15px"><span>${list.length} 个工作流</span><span class="muted">最近修改优先</span></div>${list.length?`<div class="cards">${list.map(f=>`<button class="flowcard" data-action="open-flow" data-id="${f.id}"><span class="row spread"><strong>${esc(f.name)}</strong><span aria-hidden="true">↗</span></span><span class="muted">${esc(f.desc)}</span><span class="badge">${f.workspace}</span><span class="row spread mini"><span class="badge ${f.status==='失败'?'error':f.status==='成功'?'ok':''}">${f.status}</span><span class="muted">${f.date}</span></span></button>`).join('')}</div>`:`<div class="empty"><h2>没有匹配的工作流</h2><p class="muted">试试清除筛选或切换工作区。</p><button data-action="clear-all">清除筛选</button></div>`}</section>`}
function chatView(){return `<section class="chat" aria-label="当前对话"><div class="toolbar"><strong>资料分析任务</strong><span class="grow"></span><button class="quiet" data-action="quote-flow">@ 工作流</button></div><div class="chatbody"><div class="bubble">根据我提供的资料形成分析报告，核验关键结论，并保留引用来源。</div><div class="assistant">流程已创建。你可以调整节点，也可以选中节点添加注释。固定的核验步骤会保持不变。</div>${state.messages.map(m=>`<div class="bubble">${esc(m)}</div>`).join('')}</div><div class="composer">${state.notes.length?`<button data-action="notes">${state.notes.length} 条注释</button>`:''}<div style="margin-top:8px"><span class="mention">@${esc(state.flow.name)}</span></div><textarea id="chat-draft" aria-label="聊天输入" placeholder="补充要求，或输入 @ 选择工作流">${esc(state.draft)}</textarea><div class="row spread"><button class="quiet" data-action="quote-flow">＋ 引用</button><button class="primary" data-action="send">发送 ↑</button></div></div></section>`}
function canvasPage(){return `<div class="canvas-layout ${state.mode==='side'?'split':''}">${state.mode==='side'?chatView():''}<section class="canvas" aria-label="工作流画布"><div class="canvashead"><button data-action="home">‹ 工作流</button><strong>${esc(state.flow.name)}</strong><span class="muted">已保存 · v${state.revision}</span><button data-action="toggle-mode">${state.mode==='side'?'向左展开画布':state.origin==='chat'?'返回对话':'打开对话'}</button><button data-action="run" class="primary">▷ 执行</button><button data-action="publish" class="primary">发布</button></div><div class="canvasmeta"><button data-action="variables">变量</button><button data-action="history">版本</button><button data-action="collab">协作评论</button><button data-action="snippets">片段</button><button data-action="triggers">触发器</button><button data-action="checklist">检查清单</button><button data-action="goto">⌘ K</button></div>${statusbar()}<div class="graphwrap"><div class="tools" aria-label="画布工具"><button data-action="palette" title="添加节点" aria-label="添加节点">＋</button><button data-action="tools" title="工具" aria-label="工具">◇</button><button data-action="sticky" title="便签" aria-label="便签">▱</button><hr><button data-action="pointer" title="指针模式" aria-label="指针模式" class="${state.tool==='pointer'?'active':''}">↖</button><button data-action="hand" title="手模式" aria-label="手模式" class="${state.tool==='hand'?'active':''}">✋</button><hr><button data-action="tidy" title="整理" aria-label="整理">▦</button><button data-action="export" title="导出视图" aria-label="导出视图">↗</button></div>${state.selection.length?`<div class="selectbar" aria-label="已选节点操作"><span class="muted">已选 ${state.selection.length} 个</span><button data-action="annotate">添加注释</button><button data-action="copy">复制</button><button data-action="clear-selection">取消选择</button></div>`:''}<div class="viewport" id="viewport"><div class="nodehint">拖拽框选 · Shift 增减选择 · 右键操作 · 双击配置</div><div class="stage" id="stage" style="transform:scale(${state.zoom})"><svg class="edges" width="1040" height="650" aria-hidden="true"></svg>${state.nodes.map(n=>nodeHtml(n)).join('')}<div class="sticky" id="sticky">流程说明<br>先分析材料，再核验结论。固定的节点需要明确授权才能修改。</div></div></div></div><div class="foot"><div class="row"><button data-action="undo" ${state.undo.length?'':'disabled'} aria-label="撤销">↶</button><button data-action="redo" ${state.redo.length?'':'disabled'} aria-label="重做">↷</button><span>${state.nodes.length} 个节点 · ${modeLabel()}</span></div><div class="row"><button data-action="zoom-out" aria-label="缩小">−</button><span>${Math.round(state.zoom*100)}%</span><button data-action="zoom-in" aria-label="放大">＋</button><button data-action="fit">适应视图</button><button data-action="run-detail">运行详情</button></div></div>${panelHtml()}${state.config?configHtml():''}</section></div>`}
function nodeHtml(n){const marks=state.notes.filter(a=>a.targets.includes(n.id));const phase=state.phase==='success'?'success':state.phase==='failed'||state.phase==='paused'?n.id==='verify'?'failed':'success':state.phase==='running'&&n.id==='analyze'?'running':'';return `<div role="button" tabindex="0" aria-label="${esc(n.alias)} ${esc(n.name)}" aria-pressed="${state.selection.includes(n.id)}" class="node ${state.selection.includes(n.id)?'selected':''} ${phase}" data-node="${n.id}" style="left:${n.x}px;top:${n.y}px"><div class="row spread"><span class="type">${esc(n.alias)} · ${esc(n.type)}</span></div><div class="title">${esc(n.name)} ${n.fixed?'⌑':''}</div><div class="muted">${esc(n.model?n.role+' · '+n.effort+'强度':n.type==='用户输入'?'files · query':'report · text')}</div>${marks.length?`<div class="pins">${marks.map(a=>`<button class="pin" data-action="edit-note" data-id="${a.id}" aria-label="编辑注释 ${a.id}">${a.id}</button>`).join('')}</div>`:''}</div>`}
function statusbar(){if(state.phase==='idle')return '';const text={waiting:'缺少执行必需的信息，等待回答。',running:'正在执行：分析资料。画布与本次运行版本一致。',repair:`正在自动修复 · 第 ${state.attempts} / ${state.repairLimit} 轮`,paused:`同一次故障已尝试 ${state.attempts} 轮，已暂停。已完成结果保留。`,failed:'核验节点失败：来源访问超时。',success:'执行完成：分析报告已生成。',cancelled:'本次运行已取消，既有结果保留。'}[state.phase];return `<div class="statusbar ${['failed','paused'].includes(state.phase)?'error':''}"><span>${text}</span>${['failed','paused'].includes(state.phase)?'<button data-action="repair">让 Agent 排查</button><button data-action="run-detail">查看错误</button>':''}${state.phase==='running'?'<button data-action="pause">暂停</button><button data-action="stop">停止</button>':''}${state.phase==='paused'?'<button data-action="resume">重试此步</button>':''}${state.phase==='success'?'<button data-action="save-run">查看本次改动</button>':''}</div>`}
function configHtml(){const n=state.nodes.find(n=>n.id===state.config);if(!n)return '';return `<aside class="config" aria-label="节点配置"><div class="row spread"><h2>${esc(n.alias)} 节点配置</h2><button data-action="close-config">关闭</button></div><p class="muted">${esc(n.type)}</p><label>节点名称<input id="node-name" value="${esc(n.name)}"></label><label class="row"><input id="node-fixed" type="checkbox" ${n.fixed?'checked':''}>固定此节点</label>${isModel(n)?`<label>模型<select id="node-model">${['跟随生成时 Agent 模型','用户配置的模型 A','用户配置的模型 B'].map(m=>`<option ${n.model===m?'selected':''}>${m}</option>`).join('')}</select></label><label>思考强度<select id="node-effort">${['低','中','高'].map(e=>`<option ${n.effort===e?'selected':''}>${e}</option>`).join('')}</select></label><label>角色预设<select id="node-role"><option value="">无预设</option>${state.presets.map(p=>`<option ${n.role===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><p class="fieldhint">预设仅包含角色提示词。新增或修改请前往设置。</p><button data-action="settings">管理角色预设</button><label>本节点任务要求<textarea id="node-task">提取关键事实，说明依据和不确定信息。</textarea></label>`:'<label>输入变量<input value="上游节点输出" readonly></label><label>输出字段<input value="result" readonly></label>'}<hr><div class="row"><button data-action="node-test">测试此节点</button><button class="primary" data-action="save-config">保存节点</button></div><p class="fieldhint">运行中的节点继续使用启动配置，新配置对下次执行生效。</p></aside>`}
function panelHtml(){if(!state.panel)return '';let body='';if(state.panel==='run')body=`<div class="row spread"><h2>运行详情</h2><span class="badge">${modeLabel()}</span></div><div class="row mini"><span>本次版本：${state.runVersion||'尚未启动'}</span><span>源流程：v${state.revision}</span></div><div class="log">${state.nodes.map(n=>`<div class="logline"><span>${esc(n.alias)} ${esc(n.name)}</span><span>${state.phase==='success'?'已完成':n.id==='verify'&&['paused','failed'].includes(state.phase)?'失败 · 来源超时':state.phase==='idle'?'待执行':'已记录'}</span><button data-action="node-log" data-id="${n.id}">输入 / 输出</button></div>`).join('')}</div><div class="row" style="margin-top:12px"><button data-action="simulate-failure">${state.simulateFailure?'已启用':'启用'}故障样例</button><button data-action="result">查看产物</button></div>`;if(state.panel==='variables')body=`<h2>环境变量</h2><p class="muted">变量与运行快照关联；秘密变量只显示是否已配置。</p>${state.vars.map(v=>`<div class="logline"><code>${v.name}</code><span>${v.value}</span></div>`).join('')}<button data-action="add-variable">添加变量</button>`;if(state.panel==='history')body=`<h2>版本历史</h2><div class="logline"><span>当前草稿 · v${state.revision}</span><button data-action="save-version">保存命名版本</button></div><div class="logline"><span>初始流程 · v1</span><div class="row"><button data-action="diff">查看差异</button><button data-action="restore-version">恢复为草稿</button><button data-action="dsl-export">导出 DSL</button></div></div>`;if(state.panel==='collab')body=`<h2>协作评论</h2><p class="muted">持久讨论串，与发送给 Agent 的临时注释分别保存。</p><div class="activity">${state.collab.map((c,i)=>`<div><strong>当前用户</strong><p>${esc(c.text)}</p><button data-action="resolve-comment" data-id="${i}">${c.resolved?'重新打开':'标记已解决'}</button> <span class="muted">${c.resolved?'已解决':'未解决'}</span></div>`).join('')}</div><label style="margin-top:14px">添加评论<input id="comment-text" placeholder="输入评论，可引用协作成员"></label><button data-action="add-comment">发表</button>`;return `<section class="panel"><div class="row" style="justify-content:flex-end"><button data-action="close-panel">收起</button></div>${body}</section>`}
function settings(){return `<section class="page"><div class="row spread"><h1>工作流设置</h1><button data-action="home">返回工作流</button></div><div class="settings" style="margin-top:26px"><div class="settingnav"><button data-action="preset-tab" class="${state.panel!=='recovery'?'active':''}">角色预设</button><button data-action="recovery-tab" class="${state.panel==='recovery'?'active':''}">执行与恢复</button></div><div>${state.panel==='recovery'?`<h2>Agent 故障处理方式</h2><label class="row"><input type="radio" name="faultmode" value="A" ${state.faultMode==='A'?'checked':''}>A · 确认方案后修复</label><p class="fieldhint">应用前展示修复方案，等待用户确认。</p><label class="row"><input type="radio" name="faultmode" value="B" ${state.faultMode==='B'?'checked':''}>B · 自动修复并继续（默认）</label><p class="fieldhint">仅在授权范围内调整，固定节点保护始终生效。</p><label>同一次故障的自动修复上限 <input id="repair-limit" type="number" min="1" max="10" value="${state.repairLimit}"></label><p class="fieldhint">默认 2 轮。达到上限仍失败则暂停，保留已完成结果。</p><button class="primary" data-action="save-settings">保存设置</button>`:`<div class="row spread"><div><h2>角色预设</h2><p class="muted">只保存角色提示词，模型与工具由节点单独配置。</p></div><button class="primary" data-action="new-preset">新增预设</button></div><div class="presetgrid" style="margin-top:20px">${state.presets.map((p,i)=>`<article class="preset"><h3>${esc(p.name)}</h3><p>${esc(p.prompt)}</p><button data-action="edit-preset" data-id="${i}">编辑预设</button></article>`).join('')}</div><p class="fieldhint" style="margin-top:20px">保存修改后统一更新引用节点。已开始的运行保持原配置快照。</p>`}</div></div></section>`}
function bindInputs(){const map={'search':e=>{const pos=e.target.selectionStart;state.search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)},'status-filter':e=>{state.filter=e.target.value;render()},'workspace-filter':e=>{state.workspace=e.target.value;render()},'chat-draft':e=>{state.draft=e.target.value}};for(const [id,fn] of Object.entries(map)){const el=document.getElementById(id);if(el)el.addEventListener(id==='chat-draft'||id==='search'?'input':'change',fn)}}
function drawEdges(){const svg=$('.edges');if(!svg)return;const pairs=[['input','analyze'],['analyze','output'],['analyze','verify'],['verify','output']];svg.innerHTML=pairs.map(([a,b])=>{const x=state.nodes.find(n=>n.id===a),y=state.nodes.find(n=>n.id===b);if(!x||!y)return '';const x1=x.x+194,y1=x.y+47,x2=y.x,y2=y.y+47;return `<path class="edge" d="M ${x1} ${y1} C ${x1+48} ${y1}, ${x2-48} ${y2}, ${x2} ${y2}"/>`}).join('')}
function dialog(title,body,actions='',wide=false){$('#context-root').innerHTML='';$('#overlay-root').innerHTML=`<div class="overlay"><section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row spread"><h2>${title}</h2><button data-action="close-dialog" aria-label="关闭询问框">×</button></div>${body}<div class="actions"><button data-action="close-dialog">取消</button>${actions}</div></section></div>`;setTimeout(()=>$('.dialog input:not([type=radio]),.dialog textarea,.dialog select,.dialog button')?.focus(),0)}
function closeDialog(){if(dialogKind==='input'&&state.phase==='waiting'){state.phase='idle';render()}$('#overlay-root').innerHTML='';dialogKind=''}
function editNote(id=null){noteEdit=id;const note=state.notes.find(n=>n.id===id),targets=note?note.targets:[...state.selection];if(!targets.length)return toast('请先选择节点');dialogKind='note';dialog('添加注释',`<p class="muted">引用：${targets.map(id=>{const n=state.nodes.find(n=>n.id===id);return n?esc(n.alias+' '+n.name):'已失效节点'}).join('、')}</p><textarea id="note-text" aria-label="节点修改要求" placeholder="描述希望怎样修改这些节点">${esc(note?.text||'')}</textarea><p class="fieldhint">提交后进入聊天草稿；点击聊天发送才交给 Agent。</p>`,`${note?'<button data-action="delete-note">删除注释</button>':''}<button class="primary" data-action="submit-note">提交到草稿</button>`);$('#note-text').dataset.targets=JSON.stringify(targets)}
function requestRun(){if(!state.hasInput){state.phase='waiting';render();dialogKind='input';dialog('补充执行信息','<p>当前流程需要分析资料。请选择一份样例资料，或说明本次输入。</p><label>资料来源<select id="run-input"><option value="">请选择</option><option value="sample">使用原型样例：资料 A 与资料 B</option></select></label><label>补充要求<textarea id="run-request" placeholder="例如：比较两份资料中的差异，并保留来源"></textarea></label><p id="input-error" class="error-text" role="alert"></p>','<button class="primary" data-action="submit-input">提交并继续</button>');return}startRun()}
function startRun(){clearTimeout(state.runTimer);state.phase='running';state.runVersion='run-001 · v'+state.revision;state.attempts=0;render();state.runTimer=setTimeout(()=>{state.phase=state.simulateFailure?'failed':'success';render()},1200)}
function doRepair(){if(state.attempts>=state.repairLimit){state.phase='paused';render();return toast('已达到修复上限，请明确选择新的处理方式')}if(state.faultMode==='A'){dialogKind='repair';dialog('确认修复方案','<p>读取来源超时。建议保留已完成分析，重试失败的来源读取；固定核验节点的配置不会改变。</p>','<button class="primary" data-action="approve-repair">应用并继续</button>')}else repairRound()}
function repairRound(){state.attempts++;state.phase='repair';render();clearTimeout(state.runTimer);state.runTimer=setTimeout(()=>{if(state.simulateFailure){if(state.attempts>=state.repairLimit){state.phase='paused';render()}else if(state.faultMode==='B')repairRound();else{state.phase='failed';render()}}else{state.phase='success';render()}},700)}
function palette(){dialogKind='palette';const names=['用户输入','LLM','知识检索','经典 Agent','新 Agent','问题分类器','IF/ELSE','人工输入','迭代','循环','退出循环','代码','模板转换','变量聚合器','变量赋值','文档提取器','参数提取器','HTTP 请求','列表操作','工具','输出','回答','定时触发','Webhook 触发','插件触发'];dialog('添加节点',`<p class="fieldhint">原型展示节点库与添加行为；完整字段和适用范围见节点执行规格。</p><div class="nodepalette">${names.map(n=>`<button data-action="add-node" data-name="${n}">${n}</button>`).join('')}</div>`,'',true)}
function simple(title,text){dialogKind='info';dialog(title,`<p>${text}</p>`,'<button data-action="close-dialog" class="primary">知道了</button>')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){if(!e.target.closest('.context'))$('#context-root').innerHTML='';return}const a=b.dataset.action,id=b.dataset.id;switch(a){
case'home':workflowNav();break;case'open-flow':openFlow(id);break;case'filter':state.showFilter=!state.showFilter;render();break;case'workspace-filter':state.showWorkspace=!state.showWorkspace;render();break;case'clear-filter':state.filter='全部';render();break;case'clear-all':state.filter='全部';state.search='';state.workspace='全部工作区';render();break;case'workspace-default':state.workspace='默认工作区';workflowNav();break;case'workspace-finance':state.workspace='财务研究';workflowNav();break;
case'chat-new':openFlow(state.flow.id,'chat');break;case'quote-flow':dialogKind='quote';dialog('引用工作流',`<div class="stack">${flows.filter(f=>f.workspace===state.flow.workspace).map(f=>`<button data-action="quote-select" data-id="${f.id}">@${esc(f.name)}</button>`).join('')}</div><p class="fieldhint">选中后插入引用并展示侧栏，不自动执行。</p>`);break;case'quote-select':closeDialog();openFlow(id,'chat');break;case'toggle-mode':state.mode=state.mode==='side'?'full':'side';state.origin='chat';state.config=null;render();break;
case'new-flow':dialogKind='new';dialog('新建工作流','<label>工作流名称<input id="new-name" value="新工作流"></label><label>创建方式<select id="new-mode"><option>空白创建</option><option>让 Agent 生成</option></select></label><label>任务描述<textarea id="new-task" placeholder="描述输入、处理步骤和期望结果"></textarea></label>','<button class="primary" data-action="create-flow">创建</button>');break;case'create-flow':{const name=$('#new-name').value.trim();if(!name)return toast('请填写名称');const f={id:'flow-'+Date.now(),name,desc:$('#new-task').value||'待完善的工作流',workspace:state.workspace==='全部工作区'?'默认工作区':state.workspace,status:'未运行',date:'刚刚'};flows.unshift(f);closeDialog();openFlow(f.id);break}
case'plugins':simple('插件','工作流作为插件接入宿主；此原型不修改宿主插件配置。');break;case'settings':state.page='settings';state.panel='';render();break;case'preset-tab':state.panel='';render();break;case'recovery-tab':state.panel='recovery';render();break;case'save-settings':state.faultMode=$('input[name=faultmode]:checked').value;state.repairLimit=Math.max(1,Math.min(10,Number($('#repair-limit').value)||2));toast('设置已保存；新运行采用新的策略');break;
case'new-preset':case'edit-preset':{const p=state.presets[Number(id)];dialogKind='preset';dialog(a==='new-preset'?'新增角色预设':'编辑角色预设',`<label>名称<input id="preset-name" value="${esc(p?.name||'')}"></label><label>角色提示词<textarea id="preset-prompt">${esc(p?.prompt||'')}</textarea></label><p class="fieldhint">统一更新引用它的节点；已开始运行保持原提示词快照。</p>`,`<button class="primary" data-action="save-preset" data-id="${id??''}">保存并统一更新</button>`);break}
case'save-preset':{const name=$('#preset-name').value.trim(),prompt=$('#preset-prompt').value.trim();if(!name||!prompt)return toast('请填写名称与角色提示词');if(id==='')state.presets.push({name,prompt});else{const old=state.presets[Number(id)].name;state.presets[Number(id)]={name,prompt};state.nodes.forEach(n=>{if(n.role===old)n.role=name})}closeDialog();render();toast('预设已保存，后续新运行使用新版本');break}
case'palette':palette();break;case'add-node':saveUndo();{const i=state.nodes.length;state.nodes.push({id:'n'+Date.now(),alias:'u-'+(i-3),name:b.dataset.name,type:b.dataset.name,x:70+(i%3)*260,y:440,model:isModel({type:b.dataset.name})?'跟随生成时 Agent 模型':'',effort:'中',role:'',fixed:false});touch()}closeDialog();render();toast('节点已添加为未连接草稿');break;
case'tools':simple('添加工具','选择宿主已配置的工具或 Dify 兼容工具。原型样例：网页读取、文件检索、HTTP。认证与参数在节点配置中检查。');break;case'sticky':$('#sticky').classList.toggle('hidden');break;case'pointer':state.tool='pointer';render();break;case'hand':state.tool='hand';render();break;case'tidy':saveUndo();state.nodes.forEach((n,i)=>{n.x=42+(i%3)*265;n.y=80+Math.floor(i/3)*180});touch();render();toast('布局已整理，节点编号与引用保持不变');break;case'undo':if(state.undo.length){state.redo.push(JSON.stringify(state.nodes));state.nodes=JSON.parse(state.undo.pop());touch();render()}break;case'redo':if(state.redo.length){state.undo.push(JSON.stringify(state.nodes));state.nodes=JSON.parse(state.redo.pop());touch();render()}break;
case'clear-selection':state.selection=[];render();break;case'copy':saveUndo();state.selection.forEach((x,i)=>{const n=state.nodes.find(n=>n.id===x);if(n)state.nodes.push({...n,id:'copy-'+Date.now()+'-'+i,alias:'u-'+(state.nodes.length-3),x:n.x+30,y:n.y+120,name:n.name+' 副本'})});touch();render();break;case'annotate':editNote();break;case'edit-note':editNote(Number(id));break;
case'submit-note':{const text=$('#note-text').value.trim();if(!text)return toast('请填写修改要求');const targets=JSON.parse($('#note-text').dataset.targets);if(noteEdit)state.notes=state.notes.map(n=>n.id===noteEdit?{...n,text,targets}:n);else state.notes.push({id:state.nextNote++,targets,text});closeDialog();render();toast('已加入聊天草稿，尚未发送');break}case'delete-note':state.notes=state.notes.filter(n=>n.id!==noteEdit);closeDialog();render();break;case'notes':if(state.notes.length===1)editNote(state.notes[0].id);else{dialogKind='notes';dialog('草稿注释',`<div class="stack">${state.notes.map(n=>`<button data-action="edit-note" data-id="${n.id}">${n.id}. ${esc(n.text)}</button>`).join('')}</div>`)}break;
case'send':{const text=state.draft.trim(),notes=state.notes.map(n=>`${n.targets.map(id=>state.nodes.find(x=>x.id===id)?.alias||'失效节点').join('、')}：${n.text}`);if(!text&&!notes.length){requestRun();break}state.messages.push([text,...notes].filter(Boolean).join('\n'));const hadNotes=!!notes.length;state.notes=[];state.nextNote=1;state.draft='';render();toast('模拟发送成功，临时注释标记已清除');if(!hadNotes&&/执行|运行|分析附件/.test(text)){state.hasInput=/附件|样例|资料A/.test(text);requestRun()}break}
case'node-test':simple('测试此节点','填入所需上游变量后进行单节点测试；测试结果与本次正式运行记录区分。原型不调用真实模型。');break;case'close-config':state.config=null;render();break;case'save-config':{saveUndo();const n=state.nodes.find(n=>n.id===state.config);n.name=$('#node-name').value;n.fixed=$('#node-fixed').checked;if(isModel(n)){n.model=$('#node-model').value;n.effort=$('#node-effort').value;n.role=$('#node-role').value}touch();state.config=null;render();toast('节点配置已保存');break}
case'variables':state.panel=state.panel==='variables'?'':'variables';render();break;case'history':state.panel=state.panel==='history'?'':'history';render();break;case'collab':state.panel=state.panel==='collab'?'':'collab';render();break;case'run-detail':state.panel=state.panel==='run'?'':'run';render();break;case'close-panel':state.panel='';render();break;case'add-variable':dialogKind='variable';dialog('添加环境变量','<label>变量名<input id="var-name" value="output_format"></label><label>值<input id="var-value" value="Markdown"></label>','<button class="primary" data-action="save-variable">保存</button>');break;case'save-variable':if(!$('#var-name').value.trim())return toast('请填写变量名');state.vars.push({name:$('#var-name').value,value:$('#var-value').value});closeDialog();render();break;
case'add-comment':if($('#comment-text').value.trim()){state.collab.push({text:$('#comment-text').value.trim(),resolved:false});render()}break;case'resolve-comment':state.collab[Number(id)].resolved=!state.collab[Number(id)].resolved;render();break;case'zoom-in':state.zoom=Math.min(1.5,state.zoom+.1);render();break;case'zoom-out':state.zoom=Math.max(.5,state.zoom-.1);render();break;case'fit':state.zoom=Math.min(1,Math.max(.5,($('#viewport').clientWidth-20)/840));render();break;
case'run':requestRun();break;case'submit-input':if(!$('#run-input').value&&!$('#run-request').value.trim()){$('#input-error').textContent='请提供资料来源或本次输入。';break}state.hasInput=true;dialogKind='';closeDialog();startRun();break;case'pause':clearTimeout(state.runTimer);state.phase='paused';render();break;case'stop':clearTimeout(state.runTimer);state.phase='cancelled';render();break;case'resume':state.simulateFailure=false;startRun();break;case'repair':doRepair();break;case'approve-repair':closeDialog();repairRound();break;case'simulate-failure':state.simulateFailure=!state.simulateFailure;render();toast(state.simulateFailure?'下一次执行将模拟来源超时':'下一次执行使用成功样例');break;
case'node-log':{const n=state.nodes.find(n=>n.id===id);dialog('节点输入与输出',`<h3>${esc(n.alias+' '+n.name)}</h3><div class="columns"><div>输入<pre>{ "query": "交叉核验资料", "files": ["资料 A", "资料 B"] }</pre></div><div>输出<pre>${state.phase==='success'?'已提取事实及来源。':'等待执行或失败后保留的已有结果。'}</pre></div></div><p class="fieldhint">记录实际配置与可解释结果，不显示模型私有推理过程。</p>`);break}
case'result':simple('分析报告','样例产物：关键事实摘要、资料间差异、来源索引与待核验项。正式产品在此打开文件、文本或可访问链接。');break;case'save-run':dialog('本次运行修改',`<p>本次调整保存为运行版本 ${esc(state.runVersion||'尚未运行')}。</p><p>你可以保留原流程，或把选定修改更新到原流程。</p>`,'<button data-action="close-dialog">保留本次版本</button><button data-action="apply-run" class="primary">更新原流程</button>');break;case'apply-run':touch();closeDialog();render();toast('原型中已记录更新原流程操作');break;
case'export':dialogKind='export';dialog('导出视图','<label>范围<select id="export-scope"><option>整个画布</option><option>当前视图</option></select></label><label>格式<select id="export-format"><option>PNG</option><option>JPEG</option><option>SVG</option></select></label><p class="fieldhint">视图图片与可执行 DSL 是不同导出类型。</p>','<button class="primary" data-action="export-preview">预览导出设置</button>');break;case'export-preview':{const t=$('#export-scope').value+' · '+$('#export-format').value;closeDialog();simple('导出预览',`${t}。正式版本按此设置生成图片；原型仅验证选项与交互。`);break}
case'import':dialog('导入工作流 DSL','<label>DSL 内容<textarea id="dsl-content" placeholder="粘贴 YAML，或在正式产品中选择文件"></textarea></label><p class="fieldhint">导入前检查版本、节点类型、模型、工具和资源映射，不包含凭据。</p>','<button class="primary" data-action="import-preview">检查并预览</button>');break;case'import-preview':simple('导入检查样例','模型与工具需映射到本机配置；未知扩展字段保留。正式产品校验成功后才创建独立流程。');break;case'dsl-export':simple('导出流程文件','按选定版本导出兼容 DSL；节点编号和固定状态作为本插件扩展保存。秘密变量与工具凭据不随文件导出。');break;case'save-version':touch();render();toast('已保存命名版本（演示）');break;case'restore-version':saveUndo();state.nodes=initialNodes();touch();render();toast('已恢复为新草稿，历史运行记录保留');break;case'diff':simple('版本差异','展示节点、连线、模型和提示词的变化；布局变化与执行配置变化分别标注。');break;
case'snippets':dialog('工作区片段','<p class="fieldhint">插入已发布版本后形成独立副本，不随片段修改自动更新。</p><div class="logline"><strong>资料清洗与抽取</strong><span>已发布 v2 · 3 个节点</span></div><label>片段输入 · text<input placeholder="选择当前流程的上游文本变量"></label><label>版本<select><option>v2 · 最新发布</option><option>v1</option></select></label><p>节点库中也可搜索片段；草稿不能直接插入。</p>','<button data-action="close-dialog">查看配置</button><button data-action="close-dialog" class="primary">插入副本（示意）</button>');break;
case'triggers':dialog('触发器与调度','<p class="fieldhint">触发型流程与用户输入型流程使用不同起点。此页面只展示配置，不建立真实订阅。</p><label>触发类型<select><option>定时</option><option>Webhook</option><option>插件事件</option></select></label><div class="columns"><label>计划<input value="0 9 * * 1-5"></label><label>时区<select><option>Asia/Shanghai</option><option>UTC</option></select></label></div><label>状态<select><option>停用</option><option>启用</option></select></label><p>Webhook 分测试和正式地址；事件订阅需显示插件与凭据状态。已发布触发器按发布版本执行。</p>','<button data-action="close-dialog">测试事件</button><button data-action="close-dialog" class="primary">保存配置（示意）</button>');break;
case'checklist':dialog('检查清单','<div class="logline"><span>结构与连接</span><span>样例检查通过</span></div><div class="logline"><span>模型与工具依赖</span><span>示例配置</span></div><div class="logline"><span>本次必填输入</span><span>执行前自动检查</span></div><p class="fieldhint">实际实现需逐项检测并点击定位；不以本演示的文字代表真实校验通过。</p>','<button data-action="close-dialog" class="primary">返回画布</button>');break;
case'publish':dialog('发布工作流','<p>发布会创建可供调用的固定版本。运行中的流程保持其启动版本。</p><label>版本说明<input placeholder="说明本次变更"></label><label>调用方式<select><option>本地执行与 @ 调用</option><option>API / WebApp / MCP（输入型流程）</option><option>触发调度（触发型流程）</option></select></label>','<button class="primary" data-action="publish-confirm">发布版本</button>');break;case'publish-confirm':closeDialog();toast('已模拟创建发布版本；没有对外发布服务');break;
case'goto':dialog('搜索与指令','<input id="goto-input" placeholder="搜索节点，或 /create、/refine" style="width:100%"><div class="stack" style="margin-top:16px"><button data-action="focus-verify">定位 a1-1 核验关键结论</button><button data-action="create-from-chat">/create 从需求生成</button><button data-action="refine">/refine 修改当前流程</button></div>');break;case'focus-verify':closeDialog();state.selection=['verify'];state.config='verify';render();break;case'create-from-chat':closeDialog();openFlow(state.flow.id,'chat');state.draft='请生成一个资料分析工作流';render();break;case'refine':closeDialog();state.mode='side';state.origin='chat';state.draft='请调整当前流程：';render();break;case'close-dialog':closeDialog();break;
default:toast('此入口的详细规则见 PRD 页面规格');break}
});
document.addEventListener('dblclick',e=>{const n=e.target.closest('[data-node]');if(n&&!e.target.closest('button,input')){state.config=n.dataset.node;state.selection=[n.dataset.node];render()}});
document.addEventListener('contextmenu',e=>{const n=e.target.closest('[data-node]');if(!n)return;e.preventDefault();if(!state.selection.includes(n.dataset.node)){state.selection=[n.dataset.node];render()}$('#context-root').innerHTML=`<div class="context" style="left:${Math.min(e.clientX,innerWidth-180)}px;top:${Math.min(e.clientY,innerHeight-160)}px"><button data-action="annotate">添加注释</button><button data-action="copy">复制节点</button><button data-action="clear-selection">取消选择</button></div>`});
document.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,input,select,textarea'))return;const n=e.target.closest('[data-node]'),vp=e.target.closest('#viewport');if(n&&state.tool==='pointer'){drag={id:n.dataset.node,startX:e.clientX,startY:e.clientY,moved:false};const o=state.nodes.find(v=>v.id===drag.id);drag.x=o.x;drag.y=o.y}else if(vp&&state.tool==='pointer'){const r=$('#stage').getBoundingClientRect();box={x:(e.clientX-r.left)/state.zoom,y:(e.clientY-r.top)/state.zoom,start:e.shiftKey?[...state.selection]:[]};const el=document.createElement('div');el.className='selection-box';el.id='selection-box';$('#stage').appendChild(el)}else if(vp&&state.tool==='hand'){lastPos={x:e.clientX,y:e.clientY,left:vp.scrollLeft,top:vp.scrollTop}}});
document.addEventListener('pointermove',e=>{if(box){const r=$('#stage').getBoundingClientRect(),x=(e.clientX-r.left)/state.zoom,y=(e.clientY-r.top)/state.zoom,left=Math.min(x,box.x),top=Math.min(y,box.y),right=Math.max(x,box.x),bottom=Math.max(y,box.y);Object.assign($('#selection-box').style,{left:left+'px',top:top+'px',width:(right-left)+'px',height:(bottom-top)+'px'});state.selection=[...new Set([...box.start,...state.nodes.filter(n=>n.x>=left&&n.y>=top&&n.x+194<=right&&n.y+94<=bottom).map(n=>n.id)])];document.querySelectorAll('[data-node]').forEach(el=>{el.classList.toggle('selected',state.selection.includes(el.dataset.node));el.setAttribute('aria-pressed',state.selection.includes(el.dataset.node))})}if(drag){const dx=(e.clientX-drag.startX)/state.zoom,dy=(e.clientY-drag.startY)/state.zoom;if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>5){saveUndo();drag.moved=true}if(drag.moved){const n=state.nodes.find(x=>x.id===drag.id);n.x=Math.max(5,drag.x+dx);n.y=Math.max(35,drag.y+dy);const el=document.querySelector(`[data-node="${drag.id}"]`);el.style.left=n.x+'px';el.style.top=n.y+'px';drawEdges()}}if(lastPos&&$('#viewport')){$('#viewport').scrollLeft=lastPos.left-(e.clientX-lastPos.x);$('#viewport').scrollTop=lastPos.top-(e.clientY-lastPos.y)}});
document.addEventListener('pointerup',e=>{if(box){box=null;render()}if(drag){if(drag.moved)touch();else if(e.shiftKey){state.selection=state.selection.includes(drag.id)?state.selection.filter(x=>x!==drag.id):[...state.selection,drag.id]}else state.selection=[drag.id];drag=null;render()}lastPos=null});
document.addEventListener('keydown',e=>{const n=e.target.closest('[data-node]');if(n&&[' ','Enter'].includes(e.key)){e.preventDefault();state.selection=e.shiftKey?(state.selection.includes(n.dataset.node)?state.selection.filter(x=>x!==n.dataset.node):[...state.selection,n.dataset.node]):[n.dataset.node];render();document.querySelector('[data-node="'+n.dataset.node+'"]')?.focus()}if(e.key==='Escape'){closeDialog();$('#context-root').innerHTML=''}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('[data-action=goto]')?.click()}});
render();window.__workflowPrototype={getState:()=>JSON.parse(JSON.stringify({...state,runTimer:null})),reset:()=>location.reload()};
})();
