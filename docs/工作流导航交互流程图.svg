<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8a94a6" stroke-width="1.4"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:28px;fill:#172033;font-weight:650}.body{font-size:18px;fill:#172033;font-weight:550}.sub{font-size:15px;fill:#677489}.label{font-size:14px;fill:#677489}.link{stroke:#8a94a6;stroke-width:1.8;fill:none;marker-end:url(#arrow)}</style><rect width="1200" height="1160" rx="24" fill="#f7f8fb"/><text x="54" y="64" class="title">工作流 · 导航交互流程</text><text x="54" y="96" class="sub">入口决定初始布局 · 用户控制展开 · 返回恢复来源</text><rect x="54" y="130" width="510" height="66" rx="14" fill="white" stroke="#dfe4ec"/><text x="309.0" y="160.0" text-anchor="middle" class="body">管理入口</text><text x="309.0" y="187.0" text-anchor="middle" class="sub">点击左侧「工作流」</text><rect x="636" y="130" width="510" height="66" rx="14" fill="white" stroke="#dfe4ec"/><text x="891.0" y="160.0" text-anchor="middle" class="body">对话入口</text><text x="891.0" y="187.0" text-anchor="middle" class="sub">打开工作流 / 点击已有引用</text><rect x="104" y="245" width="410" height="82" rx="14" fill="white" stroke="#dfe4ec"/><text x="309.0" y="283.0" text-anchor="middle" class="body">管理主页</text><text x="309.0" y="310.0" text-anchor="middle" class="sub">卡片、搜索与筛选 · 占满 B</text><path d="M309 196V245" class="link"/><rect x="104" y="389" width="410" height="82" rx="14" fill="#eef3ff" stroke="#b6caff"/><text x="309.0" y="427.0" text-anchor="middle" class="body">独立画布</text><text x="309.0" y="454.0" text-anchor="middle" class="sub">占满 B；返回管理主页</text><path d="M285 327V389" class="link"/><text x="225" y="364" class="label" text-anchor="middle">打开卡片</text><path d="M335 389V327" class="link"/><text x="382" y="364" class="label" text-anchor="middle">返回</text><rect x="686" y="245" width="410" height="82" rx="14" fill="#eef3ff" stroke="#b6caff"/><text x="891.0" y="283.0" text-anchor="middle" class="body">对话 + 右侧画布</text><text x="891.0" y="310.0" text-anchor="middle" class="sub">侧栏卡片保持并排</text><path d="M891 196V245" class="link"/><rect x="686" y="389" width="410" height="82" rx="14" fill="#eef3ff" stroke="#b6caff"/><text x="891.0" y="427.0" text-anchor="middle" class="body">展开画布</text><text x="891.0" y="454.0" text-anchor="middle" class="sub">占满 B，保留左侧导航 A</text><path d="M867 327V389" class="link"/><text x="798" y="364" class="label" text-anchor="middle">宿主展开按钮</text><path d="M919 389V327" class="link"/><text x="990" y="364" class="label" text-anchor="middle">显示对话</text><rect x="636" y="509" width="510" height="66" rx="14" fill="white" stroke="#dfe4ec"/><text x="891.0" y="539.0" text-anchor="middle" class="body">@ 选择只加入草稿</text><text x="891.0" y="566.0" text-anchor="middle" class="sub">点击插入的引用后，才打开右侧画布</text><rect x="54" y="509" width="510" height="66" rx="14" fill="white" stroke="#dfe4ec"/><text x="309.0" y="539.0" text-anchor="middle" class="body">配置节点 / 执行 / 查看结果</text><text x="309.0" y="566.0" text-anchor="middle" class="sub">保持当前布局，关闭画布不取消执行</text><rect x="370" y="634" width="460" height="82" rx="14" fill="white" stroke="#dfe4ec"/><text x="600.0" y="672.0" text-anchor="middle" class="body">编辑注释或 Agent 需求</text><text x="600.0" y="699.0" text-anchor="middle" class="sub">保留原布局；取消就回到原处</text><path d="M309 471V605H510V634" class="link"/><path d="M891 471V605H690V634" class="link"/><rect x="370" y="775" width="460" height="82" rx="14" fill="white" stroke="#dfe4ec"/><text x="600.0" y="813.0" text-anchor="middle" class="body">确定协作对话</text><text x="600.0" y="840.0" text-anchor="middle" class="sub">已关联则复用；否则选择同工作区对话</text><path d="M600 716V775" class="link"/><text x="715" y="750" class="label" text-anchor="middle">点击「添加到对话」</text><rect x="54" y="775" width="260" height="82" rx="14" fill="white" stroke="#dfe4ec"/><text x="184.0" y="813.0" text-anchor="middle" class="body">取消选择</text><text x="184.0" y="840.0" text-anchor="middle" class="sub">内容保留，可继续编辑</text><path d="M370 816H314" class="link"/><path d="M184 775V675H370" class="link"/><rect x="370" y="916" width="460" height="82" rx="14" fill="#eef3ff" stroke="#b6caff"/><text x="600.0" y="954.0" text-anchor="middle" class="body">对话 + 同一画布</text><text x="600.0" y="981.0" text-anchor="middle" class="sub">需求加入草稿，用户决定是否发送</text><path d="M600 857V916" class="link"/><text x="735" y="890" class="label" text-anchor="middle">已有对话 / 新建对话</text><rect x="888" y="916" width="258" height="82" rx="14" fill="white" stroke="#dfe4ec"/><text x="1017.0" y="954.0" text-anchor="middle" class="body">Agent 完成</text><text x="1017.0" y="981.0" text-anchor="middle" class="sub">提供查看入口，不抢占页面</text><path d="M830 957H888" class="link"/><text x="859" y="940" class="label" text-anchor="middle">发送</text><text x="54" y="1072" class="sub">状态保留：画布位置与缩放、节点选择、配置面板、运行详情、撤销历史、对话草稿。</text><text x="54" y="1105" class="sub">窄窗口沿用宿主适配；完整规则和异常分支见《工作流导航与布局交互》。</text></svg>