<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8792a4" stroke-width="1.4"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.title{font-size:26px;fill:#172033;font-weight:600}.body{font-size:17px;fill:#172033;font-weight:500}.sub{font-size:14px;fill:#677489}.link{stroke:#8792a4;stroke-width:1.6;fill:none;marker-end:url(#arrow)}</style><rect width="1080" height="820" rx="20" fill="#f7f8fb"/><text x="44" y="58" class="title">工作流 · 统一侧栏交互</text><text x="44" y="88" class="sub">所有入口打开原生侧栏 · 放大不替换会话 · 用户决定何时发送需求</text><rect x="44" y="125" width="300" height="76" rx="12" fill="white" stroke="#dfe4ec"/><text x="194.0" y="155" class="body" text-anchor="middle">左侧「工作流」</text><text x="194.0" y="179" class="sub" text-anchor="middle">保持当前会话</text><rect x="736" y="125" width="300" height="76" rx="12" fill="white" stroke="#dfe4ec"/><text x="886.0" y="155" class="body" text-anchor="middle">对话引用 / 查看工作流</text><text x="886.0" y="179" class="sub" text-anchor="middle">@ 选择先进入草稿</text><rect x="44" y="250" width="300" height="76" rx="12" fill="#eef3ff" stroke="#dfe4ec"/><text x="194.0" y="280" class="body" text-anchor="middle">侧栏管理主页</text><text x="194.0" y="304" class="sub" text-anchor="middle">搜索、筛选、卡片</text><rect x="394" y="250" width="292" height="76" rx="12" fill="#eef3ff" stroke="#dfe4ec"/><text x="540.0" y="280" class="body" text-anchor="middle">侧栏画布</text><text x="540.0" y="304" class="sub" text-anchor="middle">返回箭头回到侧栏主页</text><rect x="736" y="250" width="300" height="76" rx="12" fill="#eef3ff" stroke="#dfe4ec"/><text x="886.0" y="280" class="body" text-anchor="middle">宿主侧栏全屏</text><text x="886.0" y="304" class="sub" text-anchor="middle">原会话与草稿保留在后方</text><path d="M194 201V250" class="link"/><path d="M886 201V222H540V250" class="link"/><path d="M344 277H394" class="link"/><path d="M394 304H344" class="link"/><path d="M686 277H736" class="link"/><path d="M736 304H686" class="link"/><text x="369" y="240" class="sub" text-anchor="middle">卡片</text><text x="711" y="240" class="sub" text-anchor="middle">放大</text><text x="711" y="348" class="sub" text-anchor="middle">收回</text><rect x="44" y="406" width="300" height="76" rx="12" fill="white" stroke="#dfe4ec"/><text x="194.0" y="436" class="body" text-anchor="middle">原会话与草稿</text><text x="194.0" y="460" class="sub" text-anchor="middle">收起侧栏后继续对话</text><rect x="394" y="406" width="292" height="76" rx="12" fill="white" stroke="#dfe4ec"/><text x="540.0" y="436" class="body" text-anchor="middle">轻量批注浮层</text><text x="540.0" y="460" class="sub" text-anchor="middle">序号 · 节点标签 · 搜索增删</text><rect x="736" y="406" width="300" height="76" rx="12" fill="white" stroke="#dfe4ec"/><text x="886.0" y="436" class="body" text-anchor="middle">配置 / 执行 / 结果更新</text><text x="886.0" y="460" class="sub" text-anchor="middle">保持布局，不抢占页面</text><path d="M450 326V368H194V406" class="link"/><path d="M540 326V406" class="link"/><path d="M886 326V406" class="link"/><rect x="394" y="562" width="292" height="76" rx="12" fill="#eef3ff" stroke="#dfe4ec"/><text x="540.0" y="592" class="body" text-anchor="middle">提交到聊天草稿</text><text x="540.0" y="616" class="sub" text-anchor="middle">可继续补充，尚未发送</text><rect x="736" y="562" width="300" height="76" rx="12" fill="white" stroke="#dfe4ec"/><text x="886.0" y="592" class="body" text-anchor="middle">Agent 处理</text><text x="886.0" y="616" class="sub" text-anchor="middle">只有用户按发送后开始</text><path d="M540 482V562" class="link"/><path d="M686 600H736" class="link"/><text x="540" y="530" class="sub" text-anchor="middle">需要时选择同工作区的协作对话</text><text x="44" y="724" class="sub">工作流与 CLI Worker 可共用侧栏标签或由用户主动分栏；插件不改写其他面板尺寸与全屏状态。</text><text x="44" y="754" class="sub">放大、收回和收起保留工作流状态与会话草稿；收起不取消运行。更新：2026-10-16</text></svg>